<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport"
      content="width=device-width, initial-scale=1.0" />

<title>MIS Dashboard</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:'Inter',sans-serif;

  background:
  linear-gradient(
    135deg,
    #eef2ff,
    #f8fafc
  );

  color:#111827;

  overflow:hidden;
}

/* ================= LOADER ================= */

#loader{

  position:fixed;

  inset:0;

  background:
  linear-gradient(
    135deg,
    #eef2ff,
    #f8fafc
  );

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:999999;

  transition:0.4s;
}

.loader-box{
  text-align:center;
}

.spinner{

  width:70px;

  height:70px;

  border-radius:50%;

  border:6px solid #dbeafe;

  border-top:
  6px solid #2563eb;

  animation:spin 1s linear infinite;

  margin:auto;
}

.loader-text{

  margin-top:18px;

  font-size:18px;

  font-weight:700;

  color:#1e293b;
}

@keyframes spin{

  100%{
    transform:rotate(360deg);
  }
}

/* ================= HEADER ================= */

.header{

  position:sticky;

  top:0;

  z-index:1000;

  background:
  rgba(255,255,255,0.75);

  backdrop-filter:blur(18px);

  padding:18px 24px 14px;

  border-bottom:
  1px solid rgba(255,255,255,0.5);

  box-shadow:
    0 8px 30px rgba(15,23,42,0.05);
}

.topbar{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:20px;

  flex-wrap:wrap;

  margin-bottom:16px;
}

.title{

  font-size:30px;

  font-weight:800;

  color:#0f172a;

  letter-spacing:-0.5px;
}

/* ================= FILTERS ================= */

.filters{

  display:flex;

  gap:12px;

  flex-wrap:wrap;
}

.select,
.input{

  padding:12px 16px;

  border-radius:14px;

  background:white;

  font-size:18px;

  min-width:200px;

  outline:none;

  border:
  1px solid #e2e8f0;

  transition:0.25s;

  box-shadow:
    0 4px 14px rgba(15,23,42,0.05);
}

.select:focus,
.input:focus{

  border-color:#2563eb;

  box-shadow:
    0 0 0 4px rgba(37,99,235,0.12);
}

.reset-btn{

  padding:12px 22px;

  border:none;

  border-radius:14px;

  background:
  linear-gradient(
    90deg,
    #dc2626,
    #ef4444
  );

  color:white;

  font-size:13px;

  font-weight:700;

  cursor:pointer;

  box-shadow:
    0 8px 20px rgba(220,38,38,0.25);

  transition:0.3s;
}

.reset-btn:hover{

  transform:translateY(-2px);

  opacity:0.95;
}

/* ================= KPI CARDS ================= */

.summary-grid{

  display:grid;

  grid-template-columns:
  repeat(7,minmax(0,1fr));

  gap:14px;
}

.card{

  background:
  rgba(255,255,255,0.8);

  backdrop-filter:blur(14px);

  border-radius:22px;

  padding:18px;

  position:relative;

  overflow:hidden;

  border:
  1px solid rgba(255,255,255,0.5);

  box-shadow:
    0 10px 25px rgba(15,23,42,0.06);

  min-height:100px;

  transition:0.3s ease;
}

.card:hover{

  transform:translateY(-4px);

  box-shadow:
    0 18px 40px rgba(15,23,42,0.12);
}

.card::before{

  content:"";

  position:absolute;

  top:0;
  left:0;

  width:100%;

  height:5px;
}

.blue::before{

  background:
  linear-gradient(
    90deg,
    #2563eb,
    #3b82f6
  );
}

.green::before{

  background:
  linear-gradient(
    90deg,
    #16a34a,
    #22c55e
  );
}

.red::before{

  background:
  linear-gradient(
    90deg,
    #dc2626,
    #ef4444
  );
}

.card-title{

  font-size:11px;

  color:#64748b;

  margin-bottom:10px;

  font-weight:700;

  text-transform:uppercase;

  letter-spacing:0.4px;
}

.card-value{

  font-size:30px;

  font-weight:800;
}

.blue .card-value{
  color:#2563eb;
}

.green .card-value{
  color:#16a34a;
}

.red .card-value{
  color:#dc2626;
}

/* ================= TABLE ================= */

.table-area{

  padding:0 24px 24px;

  height:calc(100vh - 280px);

  overflow:hidden;
}

.table-area.full-page{

  height:calc(100vh - 92px);
}

.table-wrapper{

  height:100%;

  overflow-y:auto;

  overflow-x:hidden;

  border-radius:28px;

  background:
  rgba(255,255,255,0.75);

  backdrop-filter:blur(18px);

  border:
  1px solid rgba(255,255,255,0.4);

  box-shadow:
    0 10px 40px rgba(15,23,42,0.08);
}

table{

  width:100%;

  border-collapse:separate;

  border-spacing:0;

  table-layout:fixed;
}

/* ================= ATTRACTIVE HEADER ================= */

thead th{

  position:sticky;

  top:0;

  z-index:9;

  padding:18px 16px;

  background:
  linear-gradient(
    135deg,
    #7c3aed,
    #ec4899,
    #f59e0b
  );

  background-size:200% 200%;

  animation:headerMove 8s ease infinite;

  color:white;

  font-size:12px;

  font-weight:800;

  text-transform:uppercase;

  letter-spacing:1px;

  border:none;

  white-space:normal;

  word-wrap:break-word;

  box-shadow:
    inset 0 -1px 0 rgba(255,255,255,0.15);
}

@keyframes headerMove{

  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }
}

thead th:first-child{
  border-top-left-radius:20px;
}

thead th:last-child{
  border-top-right-radius:20px;
}


tbody tr{

  transition:0.25s;

  animation:fadeRow 0.35s ease;
}

tbody tr:nth-child(even){
  background:#f8fbff;
}

tbody tr:nth-child(odd){
  background:#ffffff;
}

tbody tr:hover{

  background:#eef4ff;

  transform:scale(1.002);

  box-shadow:
    inset 4px 0 0 #2563eb;
}

@keyframes fadeRow{

  from{
    opacity:0;
    transform:translateY(6px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

td{

  padding:18px 20px;

  border-bottom:
  1px solid #edf2f7;

  text-align:center;

  font-size:13px;

  color:#334155;

  line-height:1.6;
}

td:first-child{

  text-align:left;

  font-weight:700;

  color:#0f172a;
}

/* ================= STATUS ================= */


.done,
.pending{

  display:flex;

  align-items:center;

  justify-content:center;

  margin:auto;

  width:160px;

  height:42px;

  border-radius:999px;

  font-size:14px;

  font-weight:700;

  text-align:center;
}

.done{

  background:
  rgba(16,185,129,0.12);

  color:#059669;
}

.pending{

  background:
  rgba(236,72,153,0.12);

  color:#db2777;
}

/* ================= CLICK TASK ================= */

.click-task{

  color:#2563eb;

  cursor:pointer;

  font-weight:700;

  position:relative;
}

.click-task::after{

  content:"";

  position:absolute;

  left:0;

  bottom:-2px;

  width:0;

  height:2px;

  background:#2563eb;

  transition:0.3s;
}

.click-task:hover::after{

  width:100%;
}

/* ================= POPUP ================= */

.popup-overlay{

  position:fixed;

  inset:0;

  background:
  rgba(15,23,42,0.55);

  backdrop-filter:blur(6px);

  display:none;

  align-items:center;

  justify-content:center;

  z-index:99999;

  padding:24px;
}

.popup{

  position:absolute;

  top:50%;

  left:50%;

  transform:translate(-50%,-50%);

  width:min(1250px,96vw);

  max-height:92vh;

  background:white;

  border-radius:28px;

  overflow:hidden;

  display:flex;

  flex-direction:column;

  box-shadow:
    0 30px 80px rgba(0,0,0,0.25);
}

.popup-header{

  background:
  linear-gradient(
    135deg,
    #ffffff,
    #f8fafc
  );

  padding:22px 28px;

  border-bottom:
  1px solid #e2e8f0;

  display:flex;

  justify-content:space-between;

  align-items:center;

  cursor:move;
}

.popup-title{

  font-size:24px;

  font-weight:800;

  color:#0f172a;
}

.close-popup{

  width:42px;

  height:42px;

  border:none;

  border-radius:14px;

  background:
  linear-gradient(
    135deg,
    #ef4444,
    #dc2626
  );

  color:white;

  font-size:22px;

  cursor:pointer;
}

.popup-body{

  overflow-y:auto;

  overflow-x:hidden;

  max-height:calc(92vh - 90px);
}

.popup-table{

  width:100%;

  table-layout:fixed;

  border-collapse:separate;

  border-spacing:0;
}
/* ================= RESPONSIVE ================= */

@media(max-width:1400px){

  .summary-grid{

    grid-template-columns:
    repeat(4,1fr);
  }
}

@media(max-width:900px){

  .summary-grid{

    grid-template-columns:
    repeat(2,1fr);
  }
}

@media(max-width:768px){

  body{
    overflow:auto;
  }

  .header{
    padding:16px;
  }

  .table-area{
    padding:0 16px 16px;
    height:auto;
  }

  .filters{
    width:100%;
  }

  .select,
  .input,
  .reset-btn{

    width:100%;
    min-width:unset;
  }
}

@media(max-width:500px){

  .summary-grid{

    grid-template-columns:1fr;
  }
}

</style>

</head>

<body>

<!-- ===================================================== -->
<!-- ================= LOADING SCREEN ==================== -->
<!-- ===================================================== -->

<div id="loader">

  <div class="loader-box">

    <div class="spinner"></div>

    <div class="loader-text">
      Loading Dashboard...
    </div>

  </div>

</div>

<div class="header">

  <div class="topbar">

    <div class="title">
      MIS Dashboard
    </div>

    <div class="filters">

      <select id="sheetSelect"
              class="select">
      </select>

      <input type="text"
             id="taskFilter"
             class="input"
             placeholder="Search Task..." />

      <input type="text"
             id="employeeFilter"
             class="input"
             placeholder="Search Employee..." />

      <input type="date"
             id="dateFilter"
             class="input" />

      <button id="resetFilters"
              class="reset-btn">

        Reset

      </button>

    </div>

  </div>

  <div id="kpiSection"></div>

</div>

<div class="table-area">

  <div class="table-wrapper">

    <table>

      <thead id="tableHead"></thead>

      <tbody id="tableBody"></tbody>

    </table>

  </div>

</div>

<!-- ===================================================== -->
<!-- ================= TASK POPUP ======================= -->
<!-- ===================================================== -->

<div id="taskPopup"
     class="popup-overlay">

  <div class="popup">

    <div class="popup-header">

      <div class="popup-title"
           id="popupTitle">

        Task Details

      </div>

      <button class="close-popup"
              onclick="closePopup()">

        ×

      </button>

    </div>

    <div class="popup-body">

      <table class="popup-table">

        <thead>

          <tr>

            <th>Planned Date</th>
            <th>Timestamp</th>
            <th>Employee</th>
            <th>Task</th>
            <th>Status</th>

          </tr>

        </thead>

        <tbody id="popupTableBody"></tbody>

      </table>

    </div>

  </div>

</div>

<script>

/* ===================================================== */
/* ================= API =============================== */
/* ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwI66ZQ5_u30hlAUOWfs088j8N2aBt-rpkWMfHrsGyeC736wSohpFfIsyfb3he67D2hzg/exec";

let allData = [];

/* ===================================================== */
/* ================= STATUS CLASS ====================== */
/* ===================================================== */

function getStatusClass(status){

  const text =
    status
      .trim()
      .toLowerCase();

  return (
    text === "done"
    ||
    text === "work done"
  )
  ? "done"
  : "pending";
}

/* ===================================================== */
/* ================= FETCH DATA ======================== */
/* ===================================================== */

async function fetchData(){

  try{

    document
      .getElementById("loader")
      .style.display = "flex";

    const response =
      await fetch(API_URL);

    allData =
      await response.json();

    loadSheets();

  }catch(error){

    console.error(error);

    alert(
      "Failed to load dashboard"
    );

  }finally{

    setTimeout(()=>{

      document
        .getElementById("loader")
        .style.opacity = "0";

      setTimeout(()=>{

        document
          .getElementById("loader")
          .style.display = "none";

      },400);

    },500);
  }
}

/* ===================================================== */
/* ================= LOAD SHEETS ======================= */
/* ===================================================== */

function loadSheets(){

  const select =
    document.getElementById(
      "sheetSelect"
    );

  select.innerHTML = "";

  allData.forEach((sheet,index)=>{

    select.innerHTML += `
      <option value="${index}">
        ${sheet.sheetName}
      </option>
    `;
  });

  const params =
    new URLSearchParams(
      window.location.search
    );

  const sheetParam =
    params.get("sheet");

  let defaultIndex = 0;

  if(sheetParam){

    const foundIndex =
      allData.findIndex(sheet =>

        sheet.sheetName
          .toLowerCase()
          .trim()

        ===

        sheetParam
          .toLowerCase()
          .trim()
      );

    if(foundIndex >= 0){

      defaultIndex = foundIndex;
    }
  }

  select.value = defaultIndex;

  renderSheet(defaultIndex);

  select.addEventListener(
    "change",
    function(){
      renderSheet(this.value);
    }
  );

  document
    .getElementById("taskFilter")
    .addEventListener(
      "input",
      applyFilters
    );

  document
    .getElementById("employeeFilter")
    .addEventListener(
      "input",
      applyFilters
    );

  document
    .getElementById("dateFilter")
    .addEventListener(
      "change",
      applyFilters
    );

  document
    .getElementById("resetFilters")
    .addEventListener(
      "click",
      resetFilters
    );
}

/* ===================================================== */
/* ================= RENDER SHEET ====================== */
/* ===================================================== */

/* ===================================================== */
/* ================= RENDER SHEET ====================== */
/* ===================================================== */

function renderSheet(index){

  // =====================================================
  // ================= CURRENT SHEET =====================
  // =====================================================

  const sheet =
    allData[index];

  // =====================================================
  // ================= RESET FILTERS =====================
  // =====================================================

  document
    .getElementById("taskFilter")
    .value = "";

  document
    .getElementById("employeeFilter")
    .value = "";

  document
    .getElementById("dateFilter")
    .value = "";

  // =====================================================
  // ================= TABLE AREA ========================
  // =====================================================

  const tableArea =
    document.querySelector(
      ".table-area"
    );

  // =====================================================
  // ================= KPI SHEET =========================
  // =====================================================

  if(sheet.type === "kpi"){

    // REMOVE FULL PAGE MODE
    tableArea.classList.remove(
      "full-page"
    );

    // SHOW KPI CARDS
    renderKPICards(sheet);

    // SHOW KPI TABLE
    renderKPITable(sheet.data);

    return;
  }

  // =====================================================
  // ================= NORMAL SHEET ======================
  // =====================================================

  // ENABLE FULL PAGE MODE
  tableArea.classList.add(
    "full-page"
  );

  // REMOVE KPI CARDS
  document
    .getElementById("kpiSection")
    .innerHTML = "";

  // SHOW NORMAL TABLE
  renderNormalTable(sheet);
}


/* ===================================================== */
/* ================= KPI CARDS ========================= */
/* ===================================================== */

function renderKPICards(sheet){

  document
    .getElementById("kpiSection")
    .innerHTML = `
    <div class="summary-grid">

      <div class="card blue">
        <div class="card-title">
          Summary Daily Task
        </div>
        <div class="card-value">
          ${sheet.summary.totalTasks}
        </div>
      </div>

      <div class="card red">
        <div class="card-title">
          Last Week KPI
        </div>
        <div class="card-value">
          ${sheet.summary.lastWeekKPI}
        </div>
      </div>

      <div class="card blue">
        <div class="card-title">
          Current Week Planned
        </div>
        <div class="card-value">
          ${sheet.summary.totalPlanned}
        </div>
      </div>

      <div class="card green">
        <div class="card-title">
          Current Week Actual
        </div>
        <div class="card-value">
          ${sheet.summary.totalActual}
        </div>
      </div>

      <div class="card green">
        <div class="card-title">
          Done On Time
        </div>
        <div class="card-value">
          ${sheet.summary.totalDoneOnTime}
        </div>
      </div>

      <div class="card red">
        <div class="card-title">
          KRA
        </div>
        <div class="card-value">
          ${sheet.summary.kra}
        </div>
      </div>

      <div class="card red">
        <div class="card-title">
          KPI
        </div>
        <div class="card-value">
          ${sheet.summary.avgKPI}%
        </div>
      </div>

    </div>
  `;
}

/* ===================================================== */
/* ================= KPI TABLE ========================= */
/* ===================================================== */

function renderKPITable(data){

  document
    .getElementById("tableHead")
    .innerHTML = `
    <tr>

      <th>Task/System</th>
      <th>Benchmark</th>
      <th>Last Week KPI</th>
      <th>Current Planned</th>
      <th>Current Actual</th>
      <th>Work Not Done</th>
      <th>Done On Time</th>
      <th>KPI %</th>
      <th>Next Week Planned</th>

    </tr>
  `;

  let rows = "";

  data.forEach(item=>{

    rows += `
      <tr>

        <td>

          <span class="click-task"
                onclick="openTaskPopup(
                  '${item.benchmark}',
                  '${item.task}'
                )">

            ${item.task}

          </span>

        </td>

        <td>${item.benchmark}</td>
        <td>${item.lastWeekKPI}</td>
        <td>${item.currentPlanned}</td>
        <td>${item.currentActual}</td>
        <td>${item.workNotDone}</td>
        <td>${item.doneOnTime}</td>
        <td>${item.currentKPI}</td>
        <td>${item.nextWeekPlanned}</td>

      </tr>
    `;
  });

  document
    .getElementById("tableBody")
    .innerHTML = rows;
}

/* ===================================================== */
/* ================= NORMAL TABLE ====================== */
/* ===================================================== */

function renderNormalTable(sheet){

  document
    .getElementById("tableHead")
    .innerHTML = `
    <tr>

      <th>${sheet.headings.col1}</th>
      <th>${sheet.headings.col2}</th>
      <th>${sheet.headings.col3}</th>
      <th>${sheet.headings.col4}</th>
      <th>${sheet.headings.col5}</th>

    </tr>
  `;

  renderFilteredTable(sheet.data);
}

/* ===================================================== */
/* ================= FILTER TABLE ====================== */
/* ===================================================== */

function renderFilteredTable(data){

  let rows = "";

  data.forEach(item=>{

    const statusClass =
      getStatusClass(
        item.status
      );

    rows += `
      <tr>

        <td>${item.plannedDate}</td>

        <td>${item.timestamp}</td>

        <td>${item.employee}</td>

        <td style="text-align:left">
          ${item.task}
        </td>

        <td>
  <div class="${statusClass}">
    ${item.status}
  </div>
</td>

      </tr>
    `;
  });

  document
    .getElementById("tableBody")
    .innerHTML = rows;
}

/* ===================================================== */
/* ================= APPLY FILTER ====================== */
/* ===================================================== */

function applyFilters(){

  const task =
    document
      .getElementById("taskFilter")
      .value
      .toLowerCase();

  const employee =
    document
      .getElementById("employeeFilter")
      .value
      .toLowerCase();

  const date =
    document
      .getElementById("dateFilter")
      .value;

  const select =
    document
      .getElementById("sheetSelect");

  const sheet =
    allData[select.value];

  if(sheet.type === "kpi"){

    const filtered =
      sheet.data.filter(item =>

        item.task
          .toLowerCase()
          .includes(task)
      );

    renderKPITable(filtered);

    return;
  }

  const filtered =
    sheet.data.filter(item=>{

      const taskMatch =
        item.task
          .toLowerCase()
          .includes(task);

      const employeeMatch =
        item.employee
          .toLowerCase()
          .includes(employee);

      let dateMatch = true;

      if(date){

        const itemDate =
          item.plannedDate
            .split(" ")[0];

        const parts =
          itemDate.split("/");

        if(parts.length === 3){

          const formatted =
            `${parts[2]}-${parts[1]}-${parts[0]}`;

          dateMatch =
            formatted === date;
        }
      }

      return (
        taskMatch &&
        employeeMatch &&
        dateMatch
      );
    });

  renderFilteredTable(filtered);
}

/* ===================================================== */
/* ================= RESET FILTER ====================== */
/* ===================================================== */

function resetFilters(){

  document
    .getElementById("taskFilter")
    .value = "";

  document
    .getElementById("employeeFilter")
    .value = "";

  document
    .getElementById("dateFilter")
    .value = "";

  const select =
    document
      .getElementById("sheetSelect");

  renderSheet(select.value);
}

/* ===================================================== */
/* ================= TASK POPUP ======================== */
/* ===================================================== */

function openTaskPopup(benchmark,task){

  const currentSheetIndex =
    document
      .getElementById("sheetSelect")
      .value;

  const currentKPISheet =
    allData[currentSheetIndex];

  let currentUser =
    currentKPISheet.sheetName
      .replace(/kpi/gi,"")
      .trim()
      .toLowerCase();

  const targetSheet =
    allData.find(sheet =>

      sheet.type === "normal"

      &&

      sheet.sheetName
        .toLowerCase()
        .includes(
          benchmark.toLowerCase()
        )
    );

  if(!targetSheet){

    alert(
      "No matching sheet found"
    );

    return;
  }

  const matchedTasks =
    targetSheet.data.filter(item =>

      item.task
        .toLowerCase()
        .includes(
          task.toLowerCase()
        )

      &&

      item.employee
        .toLowerCase()
        .includes(
          currentUser
        )
    );

  if(matchedTasks.length === 0){

    alert(
      "No matching task found"
    );

    return;
  }

  document
    .getElementById("popupTitle")
    .innerText =
      task;

  let rows = "";

  matchedTasks.forEach(item=>{

    const statusClass =
      getStatusClass(
        item.status
      );

    rows += `
      <tr>

        <td>${item.plannedDate}</td>
        <td>${item.timestamp}</td>
        <td>${item.employee}</td>
        <td>${item.task}</td>

       <td>
  <div class="${statusClass}">
    ${item.status}
  </div>
</td>

      </tr>
    `;
  });

  document
    .getElementById(
      "popupTableBody"
    )
    .innerHTML = rows;

  document
    .getElementById(
      "taskPopup"
    )
    .style.display = "flex";
}

/* ===================================================== */
/* ================= CLOSE POPUP ======================= */
/* ===================================================== */

function closePopup(){

  document
    .getElementById(
      "taskPopup"
    )
    .style.display = "none";
}

/* ===================================================== */
/* ================= DRAG POPUP ======================== */
/* ===================================================== */

const popup =
  document.querySelector(".popup");

const popupHeader =
  document.querySelector(".popup-header");

let isDragging = false;

let offsetX = 0;
let offsetY = 0;

popupHeader.addEventListener(
  "mousedown",
  function(e){

    isDragging = true;

    const rect =
      popup.getBoundingClientRect();

    offsetX =
      e.clientX - rect.left;

    offsetY =
      e.clientY - rect.top;

    popup.style.transition = "none";
  }
);

document.addEventListener(
  "mousemove",
  function(e){

    if(!isDragging) return;

    let left =
      e.clientX - offsetX;

    let top =
      e.clientY - offsetY;

    // KEEP INSIDE SCREEN

    const maxLeft =
      window.innerWidth -
      popup.offsetWidth;

    const maxTop =
      window.innerHeight -
      popup.offsetHeight;

    left = Math.max(
      0,
      Math.min(left,maxLeft)
    );

    top = Math.max(
      0,
      Math.min(top,maxTop)
    );

    popup.style.left =
      left + "px";

    popup.style.top =
      top + "px";

    popup.style.transform =
      "none";
  }
);

document.addEventListener(
  "mouseup",
  function(){

    isDragging = false;
  }
);

/* ===================================================== */
/* ================= OUTSIDE CLICK ===================== */
/* ===================================================== */

window.addEventListener(
  "click",
  function(e){

    const popup =
      document.getElementById(
        "taskPopup"
      );

    if(e.target === popup){

      closePopup();
    }
  }
);

/* ===================================================== */
/* ================= START ============================= */
/* ===================================================== */

fetchData();

</script>
