<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Employee Dashboard</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Segoe UI',sans-serif;
    }

    html,
    body{
      width:100%;
      height:100%;
      overflow:hidden;
    }

    body{

      background:linear-gradient(135deg,#eef2ff,#f8fafc);

      display:flex;
      justify-content:center;
      align-items:center;

      padding:20px;

    }

    /* MAIN CARD */

    .main-card{

      width:min(92vw,1100px);

      height:min(88vh,760px);

      background:#fff;

      border-radius:28px;

      overflow:hidden;

      box-shadow:
      0 10px 30px rgba(0,0,0,0.08),
      0 25px 60px rgba(37,99,235,0.08);

      display:flex;
      flex-direction:column;

      position:relative;

    }

    /* TOP BAR */

    .top-bar{

      background:linear-gradient(135deg,#2563eb,#1e3a8a);

      padding:18px 28px;

      display:flex;
      justify-content:space-between;
      align-items:center;

      gap:15px;

      flex-wrap:wrap;

    }

    .title{

      color:#fff;

      font-size:30px;

      font-weight:800;

    }

    .dropdown{

      min-width:280px;

      padding:14px 18px;

      border:none;
      outline:none;

      border-radius:14px;

      background:#fff;

      font-size:15px;

      font-weight:600;

      color:#111;

      cursor:pointer;

      box-shadow:0 5px 15px rgba(0,0,0,0.12);

    }

    /* CONTENT */

    .content{

      flex:1;

      position:relative;

      overflow:hidden;

    }

    /* EMPTY STATE */

    .empty-state{

      width:100%;
      height:100%;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;

      text-align:center;

      padding:30px;

    }

    .empty-icon{

      width:120px;
      height:120px;

      border-radius:50%;

      background:
      linear-gradient(135deg,#2563eb,#1d4ed8);

      display:flex;
      justify-content:center;
      align-items:center;

      font-size:52px;

      color:#fff;

      margin-bottom:25px;

      box-shadow:
      0 15px 35px rgba(37,99,235,0.3);

    }

    .empty-title{

      font-size:38px;

      font-weight:800;

      color:#111827;

      margin-bottom:14px;

    }

    .empty-subtitle{

      max-width:580px;

      font-size:19px;

      line-height:1.7;

      color:#6b7280;

    }

    /* EMPLOYEE SECTION */

    .employee-layout{

      display:none;

      width:100%;
      height:100%;

      padding:35px 50px;

      align-items:center;
      justify-content:center;

      gap:50px;

      flex-wrap:wrap;

    }

    /* IMAGE */

    .photo-section{

      flex:1;

      display:flex;
      justify-content:center;
      align-items:center;

      min-width:260px;

    }

    .photo-box{

      width:280px;
      height:340px;

      border-radius:24px;

      overflow:hidden;

      background:#f3f4f6;

      box-shadow:
      0 12px 30px rgba(0,0,0,0.12);

    }

    .photo-box img{

      width:100%;
      height:100%;

      object-fit:cover;

    }

    /* DETAILS */

    .details-section{

      flex:1;

      min-width:280px;

      display:flex;
      flex-direction:column;
      justify-content:center;

    }

    .label{

      font-size:13px;

      letter-spacing:1.5px;

      text-transform:uppercase;

      color:#6b7280;

      margin-bottom:10px;

    }

    .name{

      font-size:42px;

      font-weight:900;

      line-height:1.2;

      color:#111827;

      margin-bottom:24px;

    }

    .designation{

      font-size:24px;

      line-height:1.5;

      color:#374151;

      margin-bottom:36px;

    }

    .dashboard-btn{

      display:inline-flex;

      align-items:center;
      justify-content:center;

      width:fit-content;

      padding:15px 32px;

      background:
      linear-gradient(135deg,#111827,#374151);

      color:#fff;

      text-decoration:none;

      border-radius:16px;

      font-size:16px;

      font-weight:700;

      transition:0.3s;

      box-shadow:
      0 10px 25px rgba(0,0,0,0.15);

    }

    .dashboard-btn:hover{

      transform:translateY(-4px);

      box-shadow:
      0 18px 35px rgba(0,0,0,0.22);

    }

    /* LOADER */

    .loader{

      position:fixed;

      top:0;
      left:0;

      width:100%;
      height:100%;

      background:#eef2ff;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;

      z-index:99999;

    }

    .spinner{

      width:80px;
      height:80px;

      border:8px solid #dbeafe;
      border-top:8px solid #2563eb;

      border-radius:50%;

      animation:spin 1s linear infinite;

      margin-bottom:25px;

    }

    .loading-text{

      font-size:22px;

      font-weight:700;

      color:#2563eb;

    }

    @keyframes spin{

      0%{
        transform:rotate(0deg);
      }

      100%{
        transform:rotate(360deg);
      }

    }

    /* TABLET */

    @media(max-width:900px){

      .employee-layout{

        flex-direction:column;

        text-align:center;

        padding:25px;

        gap:25px;

      }

      .details-section{

        align-items:center;

      }

      .photo-box{

        width:240px;
        height:300px;

      }

      .name{

        font-size:34px;

      }

      .designation{

        font-size:20px;

      }

    }

    /* MOBILE */

    @media(max-width:600px){

      body{
        padding:0;
      }

      .main-card{

        width:100vw;
        height:100vh;

        border-radius:0;

      }

      .top-bar{

        padding:16px;

        justify-content:center;

        text-align:center;

      }

      .dropdown{

        width:100%;

        min-width:100%;

      }

      .photo-box{

        width:210px;
        height:260px;

      }

      .dashboard-btn{

        width:100%;

      }

      .empty-title{

        font-size:30px;

      }

      .empty-subtitle{

        font-size:16px;

      }

    }

  </style>
</head>

<body>

<!-- LOADER -->

<div class="loader" id="loader">

  <div class="spinner"></div>

  <div class="loading-text">
    Loading Employee Data...
  </div>

</div>

<!-- MAIN CARD -->

<div class="main-card">

  <!-- TOP BAR -->

  <div class="top-bar">

    <div class="title">
      Employee Dashboard
    </div>

    <select class="dropdown" id="employeeSelect">

      <option value="">
        Select Employee Name
      </option>

    </select>

  </div>

  <!-- CONTENT -->

  <div class="content">

    <!-- EMPTY STATE -->

    <div class="empty-state" id="emptyState">

      <div class="empty-icon">
        👤
      </div>

      <div class="empty-title">
        No Employee Selected
      </div>

      <div class="empty-subtitle">

        Please select employee name from dropdown
        menu to view employee details and access dashboard.

      </div>

    </div>

    <!-- EMPLOYEE DETAILS -->

    <div class="employee-layout" id="employeeLayout">

      <div class="photo-section">

        <div class="photo-box">

          <img id="photo" src="">

        </div>

      </div>

      <div class="details-section">

        <div class="label">
          Employee Name
        </div>

        <div class="name" id="name">
          -
        </div>

        <div class="label">
          Designation
        </div>

        <div class="designation" id="designation">
          -
        </div>

        <a id="dashboardBtn"
           class="dashboard-btn"
           href="#"
           target="_blank">

           Open Dashboard →

        </a>

      </div>

    </div>

  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwlXb890NzZRFqHYd1EP27eqAmpsetP6RFLYMtZ4a3rwzhp19BIlMpgdynB0Ex46e-Fcg/exec";

let employees = [];

fetch(API_URL)

.then(res => res.json())

.then(data => {

  employees = data;

  const dropdown =
  document.getElementById("employeeSelect");

  data.forEach((emp,index) => {

    dropdown.innerHTML += `

      <option value="${index}">
        ${emp.name}
      </option>

    `;

  });

  showEmployee("");

  document.getElementById("loader").style.display =
  "none";

})

.catch(err => {

  console.log(err);

  document.querySelector(".loading-text").innerText =
  "Failed To Load Data";

});

document.getElementById("employeeSelect")

.addEventListener("change", function(){

  showEmployee(this.value);

});

function showEmployee(index){

  const emptyState =
  document.getElementById("emptyState");

  const employeeLayout =
  document.getElementById("employeeLayout");

  // DEFAULT UI

  if(index === ""){

    emptyState.style.display = "flex";

    employeeLayout.style.display = "none";

    return;

  }

  // SHOW EMPLOYEE

  const emp = employees[index];

  emptyState.style.display = "none";

  employeeLayout.style.display = "flex";

  // AUTO GOOGLE DRIVE IMAGE CONVERTER

  let photoUrl = emp.photo;

  if(photoUrl.includes("drive.google.com")){

    let fileId = "";

    // FORMAT 1
    // https://drive.google.com/file/d/FILE_ID/view

    if(photoUrl.includes("/d/")){

      fileId =
      photoUrl.split("/d/")[1].split("/")[0];

    }

    // FORMAT 2
    // https://drive.google.com/open?id=FILE_ID

    else if(photoUrl.includes("id=")){

      fileId =
      photoUrl.split("id=")[1].split("&")[0];

    }

    // FINAL DIRECT IMAGE URL

    if(fileId){

      photoUrl =
      `https://lh3.googleusercontent.com/d/${fileId}`;

    }

  }

  // SET IMAGE

  document.getElementById("photo").src =
  photoUrl;

  // OPTIONAL FALLBACK IMAGE

  document.getElementById("photo").onerror =
  function(){

    this.src =
    "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";

  };

  document.getElementById("name").innerText =
  emp.name;

  document.getElementById("designation").innerText =
  emp.designation;

  document.getElementById("dashboardBtn").href =
  emp.dashboard;

}

</script>

</body>
</html>
